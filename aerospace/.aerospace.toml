# STARTUP
start-at-login = true
after-startup-command = []

# GENERAL SETTINGS
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
accordion-padding = 300
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]
automatically-unhide-macos-hidden-apps = false

# WINDOW RULES
[[on-window-detected]]
if.app-name-regex-substring = '^(Finder|System Settings|Calculator|Calendar|Dictionary|App Store|Activity Monitor|System Information)$'
run = "layout floating"

# WORKSPACE ASSIGNMENTS
[[on-window-detected]]
if.app-name-regex-substring = "Zen"
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-name-regex-substring = "Helium"
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-name-regex-substring = "Zed"
run = "move-node-to-workspace 2"

[[on-window-detected]]
if.app-name-regex-substring = "Ghostty"
run = "move-node-to-workspace 3"

[[on-window-detected]]
if.app-name-regex-substring = "Hermes"
run = "move-node-to-workspace 4"

[[on-window-detected]]
if.app-name-regex-substring = "Spotify"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-name-regex-substring = "WhatsApp"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-name-regex-substring = "MongoDB Compass"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-name-regex-substring = "Obsidian"
run = "move-node-to-workspace 5"

# GAPS & MAPPING
[key-mapping]
preset = "qwerty"

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# MAIN BINDINGS
[mode.main.binding]
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-tab = "workspace-back-and-forth"
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"

alt-shift-1 = "move-node-to-workspace 1 --focus-follows-window"
alt-shift-2 = "move-node-to-workspace 2 --focus-follows-window"
alt-shift-3 = "move-node-to-workspace 3 --focus-follows-window"
alt-shift-4 = "move-node-to-workspace 4 --focus-follows-window"
alt-shift-5 = "move-node-to-workspace 5 --focus-follows-window"

alt-a = "exec-and-forget open -a Helium"
alt-w = "exec-and-forget open -a WhatsApp"
alt-e = "exec-and-forget open -a Finder"
alt-p = "exec-and-forget open -a 1Password"
alt-z = "exec-and-forget open -a Zed"
alt-enter = "exec-and-forget open -a Ghostty"
alt-o = "exec-and-forget open -a Obsidian"
alt-m = "exec-and-forget open -a \"MongoDB Compass\""
alt-cmd-s = "exec-and-forget open -a Spotify"
alt-cmd-h = "exec-and-forget open -a Hermes"
alt-cmd-z = "exec-and-forget open -a Zen"

alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

alt-v = "split vertical"
alt-s = "split horizontal"

alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

alt-space = "layout floating tiling"
alt-f = "fullscreen"

alt-shift-semicolon = "mode service"
alt-shift-enter = "mode apps"
alt-d = "mode layout"

# MODES
[mode.layout.binding]
t = ["layout tiles horizontal vertical", "mode main"]
a = ["layout accordion horizontal vertical", "mode main"]
r = ["flatten-workspace-tree", "mode main"]
esc = ["mode main"]
enter = ["mode main"]

[mode.service.binding]
esc = ["mode main"]
r = ["reload-config", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]

[mode.apps.binding]
alt-enter = ["exec-and-forget open -a Ghostty", "mode main"]
esc = ["mode main"]
