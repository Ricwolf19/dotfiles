##################################################
# GLOBAL SETTINGS
##################################################
# Prefix: Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal colors
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Vi mode + mouse
setw -g mode-keys vi
set -g mouse on

# History & behavior
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on  # For nvim autoread

# Status bar
set -g status on
set -g status-position top
set -g status-interval 3

# Pane borders (Tokyo Night)
set -g pane-border-style fg=#414868
set -g pane-active-border-style fg=#7aa2f7

##################################################
# PLUGINS (TPM)
##################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Session management (keeps only ONE of these)
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Manual save/restore (C-s save, C-r restore)
# Removed tmux-continuum (causes auto-restore conflicts)

# Productivity
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Theme
set -g @plugin 'fabioluciano/tmux-powerkit'

##################################################
# RESURRECT CONFIG (manual control)
##################################################
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# Manual save: C-Space + C-s
# Manual restore: C-Space + C-r

##################################################
# POWERKIT THEME
##################################################
set -g @powerkit_theme 'tokyo-night'
set -g @powerkit_theme_variant 'night'
set -g @powerkit_plugins 'session,windows,git,cpu,battery,datetime'

##################################################
# FZF CONFIG
##################################################
set -g @fzf-url-fzf-options '-p 60%,30% --prompt=" " --border-label="Open URL"'
set -g @fzf-url-history-limit '2000'

##################################################
# SESSIONX / FLOAX
##################################################
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'p'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'

##################################################
# KEYBINDINGS
##################################################
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Splits (preserve current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind z resize-pane -Z

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -p "Rename window:" "rename-window %%"
bind w choose-window

# Copy mode (vi-style)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

##################################################
# INITIALIZE TPM
##################################################
run "~/.tmux/plugins/tpm/tpm"
