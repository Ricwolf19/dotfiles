##################################################
# GLOBAL SETTINGS
##################################################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:RGB"

setw -g mode-keys vi
set -g mouse on

set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on

set -g status on
set -g status-position top
set -g status-interval 3

# One Dark colors (matching Zed)
set -g pane-border-style fg=#3e4451
set -g pane-active-border-style fg=#528bff

##################################################
# PLUGINS
##################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fabioluciano/tmux-powerkit'

##################################################
# RESURRECT
##################################################
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

##################################################
# POWERKIT ONE DARK THEME
##################################################
set -g @powerkit_theme 'one-dark'
set -g @powerkit_theme_variant 'dark'
set -g @powerkit_plugins 'session,windows,git,cpu,battery,datetime'

# Change theme selector to C-t (avoids C-r conflict with resurrect)
set -g @powerkit_plugin_theme_selector_key 'off'

##################################################
# FZF/SESSIONX/FLOAX
##################################################
set -g @fzf-url-fzf-options '-p 60%,30% --prompt=" " --border-label="Open URL"'
set -g @fzf-url-history-limit '2000'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-bind 'p'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'

##################################################
# KEYBINDINGS
##################################################
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind z resize-pane -Z

# Vim navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
bind c new-window -c "#{pane_current_path}"
bind , command-prompt -p "Rename window:" "rename-window %%"
bind w choose-window

# Copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

##################################################
# INITIALIZE TPM
##################################################
run "~/.tmux/plugins/tpm/tpm"
